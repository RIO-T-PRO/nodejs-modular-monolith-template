services:
  # ============================================================================
  # APPS CONTAINER
  # ============================================================================
  api:
    build:
      context: .
      # Tells compose to grab Stage 5 (the runtime stage) from the Dockerfile.
      target: runtime
    ports:
      # Map port 4001 on your computer to port 4001 inside the container.
      - '${PORT:-4001}:${PORT:-4001}'
    # SECURITY & CLEAN CODE NOTE:
    # This reads all keys from your local, un-tracked '.env' file.
    # Anyone using this template needs to copy '.env.example' to '.env' first!
    env_file:
      - .env
    depends_on:
      db:
        # Waits for Postgres to be fully booted up before starting our code.
        condition: service_healthy
      # redis:
      #   # Commented out for now. Uncomment this when you switch MESSAGE_DISPATCHER to "redis".
      #   condition: service_healthy
    restart: unless-stopped
    networks:
      # Connects to the internal network to communicate with the DB and Redis securely.
      - app-network
      # DEPLOYMENT NOTE: Uncomment 'proxy-tier' below when deploying to production
      # behind an automated reverse proxy (like nginx-proxy / acme-companion for SSL).
      # - proxy-tier

  # ============================================================================
  # POSTGRES DATABASE
  # ============================================================================
  db:
    image: postgres:16-alpine
    environment:
      # SECURITY BEST PRACTICE: No secrets are hardcoded here.
      # Docker pulls these straight out of the user's private local .env file.
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-app_db}
    ports:
      - '5432:5432'
    volumes:
      # This named volume makes sure your database data isn't deleted
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # The ping test that tells our application container that the database is officially ready.
      # We use the dynamic user variable here to keep it flexible.
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      # SECURITY BEST PRACTICE: The database remains isolated on the internal network.
      # It is never attached to the proxy-tier, preventing direct external access.
      - app-network

  # ============================================================================
  # REDIS (OPTIONAL CACHE/EVENTS LAYER)
  # ============================================================================
  # COMMENTED OUT: Keep this ready for when your monolith domains expand.
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - '6379:6379'
  #   healthcheck:
  #     test: ['CMD', 'redis-cli', 'ping']
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - app-network

# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================
networks:
  # The default isolated internal network for inter-container communication.
  app-network:
    driver: bridge

  # DEPLOYMENT NOTE: Uncomment this block when deploying to a Linux server
  # using an automated reverse proxy.
  # IMPORTANT: Before running 'docker compose up' on the server, you must
  # create this network manually on the host machine using:
  # $ docker network create proxy-tier
  #
  # proxy-tier:
  #   external: true

# ============================================================================
# VOLUME CONFIGURATION
# ============================================================================
volumes:
  # Named volumes guarantee that your data persists across container restarts and rebuilds.
  # If a user tears down the environment (docker compose down), this database volume
  # remains safely stored on the host machine.
  # WARNING TO USERS: To completely wipe the database and start fresh, you must
  # explicitly delete the volume by running: docker compose down -v
  db_data:
    # Optional: If you eventually deploy to a cloud provider (AWS/GCP),
    # you can configure external storage drivers here.
